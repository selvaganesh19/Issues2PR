[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "issue2pr"
version = "0.1.0"
description = "Autonomous GitHub issue -> tested pull request agent."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Issue2PR" }]
dependencies = [
    "openai>=1.30",
    "pydantic-settings>=2.0",
    "typer>=0.9",
    "python-dotenv",
    "rich",
]

[project.optional-dependencies]
dev = ["pytest", "ruff", "mypy", "httpx", "fakeredis"]
server = [
    "fastapi",
    "uvicorn[standard]",
    "redis",
    "fakeredis",
    "sqlalchemy[asyncio]",
    "asyncpg",
    "alembic",
    "pyjwt",
    "cryptography",
    "httpx",
]
index = ["faiss-cpu", "numpy"]
dashboard = ["gradio"]

[project.scripts]
issue2pr = "app.cli:app"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
