# Reusable Issue2PR workflow. Other repos call this via `uses:` -- they do NOT
# copy it. See the "Use this on your repo" section of the README.
#
# Callers pass their own secrets with `secrets: inherit`.

name: issue2pr agent (reusable)
on:
  workflow_call:
    inputs:
      task:
        description: "Instruction given to the agent about the pushed code."
        required: false
        type: string
        default: "Review and improve ONLY the code changed in this push. Find bugs, fix them, keep existing behavior."
      notify_email:
        description: "Where to email the run result. Optional; falls back to the pusher's commit email. GitHub privacy noreply addresses are undeliverable and are skipped."
        required: false
        type: string
        default: ""
      relay_url:
        description: "Mail relay endpoint. Defaults to the shared instance. Deploy your own copy (see the mail-relay repo) and set this to send from YOUR mail identity and use YOUR sending quota."
        required: false
        type: string
        default: "https://issue2pr-mail-relay.vercel.app/api/send"
    secrets:
      GROQ_API_KEY:       { required: true }
      OPENROUTER_API_KEY: { required: false }
      # Optional. Set only if the relay enforces RELAY_TOKEN. When the relay has
      # no RELAY_TOKEN configured, leave this unset and the relay stays open.
      RELAY_TOKEN:        { required: false }

permissions:
  contents: write
  pull-requests: write
  id-token: write   # mint a GitHub OIDC token so the relay can verify the caller

jobs:
  agent:
    if: "!contains(github.event.head_commit.message, '[skip agent]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git identity
        run: |
          git config --global user.name "issue2pr-agent[bot]"
          git config --global user.email "issue2pr-agent@users.noreply.github.com"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install issue2pr
        run: pip install "git+https://github.com/selvaganesh19/Issues2PR.git"

      - name: Agent works on the pushed code
        id: agent
        continue-on-error: true
        env:
          GROQ_API_KEY:       ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          python -m app.cli fix . "${{ inputs.task }}" 2>&1 | tee run.log

      - name: Build report
        id: report
        run: |
          # Agent commits its own changes on a new branch, so compare the
          # agent's HEAD against the commit that triggered this run rather than
          # inspecting the (clean) working tree.
          changed=$(git diff --name-only ${{ github.sha }} HEAD | wc -l)
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
          git diff --stat ${{ github.sha }} HEAD > diffstat.txt || true

      - name: Email the pusher via relay
        if: always()
        env:
          # Central mail relay (Vercel). Sender creds live on the relay, so
          # caller repos need NO mail secrets. Override with the `relay_url`
          # input to point at your own deployment.
          RELAY_URL: ${{ inputs.relay_url }}
          NOTIFY_EMAIL: ${{ inputs.notify_email }}
          COMMIT_EMAIL: ${{ github.event.head_commit.author.email }}
          RELAY_TOKEN: ${{ secrets.RELAY_TOKEN }}
        run: |
          # Prefer the caller-provided address; fall back to the pusher's commit
          # email. GitHub privacy noreply addresses cannot receive mail, so skip
          # them (the relay guards too, but this avoids a pointless call).
          to="${NOTIFY_EMAIL:-$COMMIT_EMAIL}"
          if [ -z "$to" ]; then echo "no recipient; skipping notify"; exit 0; fi
          case "$to" in
            *@users.noreply.github.com)
              echo "recipient $to is a GitHub noreply address (undeliverable); skipping. Set 'notify_email' to receive mail."
              exit 0 ;;
          esac
          # Mint a GitHub OIDC token if the caller granted id-token: write. The
          # relay verifies it to trust the repo/actor without any shared secret.
          # Empty when the permission is absent -- relay then uses token/open mode.
          oidc=""
          if [ -n "$ACTIONS_ID_TOKEN_REQUEST_URL" ]; then
            oidc=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
              "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=issue2pr-mail-relay" \
              | jq -r '.value // empty')
          fi
          payload=$(jq -nc \
            --arg to "$to" \
            --arg repo '${{ github.repository }}' \
            --arg outcome '${{ steps.agent.outcome }}' \
            --arg sha '${{ github.sha }}' \
            --arg changed '${{ steps.report.outputs.changed }}' \
            '{to:$to, repo:$repo, outcome:$outcome, sha:$sha, changed:$changed}')
          curl -sS -X POST "$RELAY_URL" \
            -H "Content-Type: application/json" \
            ${oidc:+-H "Authorization: Bearer $oidc"} \
            ${RELAY_TOKEN:+-H "X-Relay-Token: $RELAY_TOKEN"} \
            --data "$payload" && echo "relay notified ($to)" \
            || echo "relay notify failed (non-fatal)"

      - name: Open PR with the agent's changes
        if: steps.report.outputs.changed != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          branch="agent/review-${{ github.sha }}"
          # The agent already committed its fix on the current HEAD; push that
          # branch and open a PR. peter-evans/create-pull-request only picks up
          # *uncommitted* working-tree changes, so it saw nothing here.
          git push --force origin HEAD:"refs/heads/$branch"
          gh pr create --base "${{ github.ref_name }}" --head "$branch" \
            --title "Agent review of pushed code (${{ steps.agent.outcome }})" \
            --body "Automated review/fix of ${{ github.sha }}. Outcome: ${{ steps.agent.outcome }}." \
            || echo "PR already exists for $branch"
