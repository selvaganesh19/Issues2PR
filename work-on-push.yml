# Copy this file into your TARGET repo at: .github/workflows/work-on-push.yml
#
# Required repo Actions secrets (Settings -> Secrets and variables -> Actions):
#   GROQ_API_KEY        - primary LLM key
#   OPENROUTER_API_KEY  - fallback LLM key (free model)
#   MAIL_USERNAME       - sender Gmail address
#   MAIL_PASSWORD       - Gmail APP PASSWORD (never the account password)
#
# The agent runs only on pushed code, opens a PR, and emails the pusher.

name: work on pushed code
on:
  push:
    branches-ignore:
      - 'agent/**'        # ignore the agent's own PR branches (stops loops)
permissions:
  contents: write
  pull-requests: write
jobs:
  agent:
    if: "!contains(github.event.head_commit.message, '[skip agent]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      # Install issue2pr. If issue2pr is a SEPARATE repo, replace the line below
      # with:  pip install "git+https://github.com/<you>/issue2pr.git"
      - name: Install issue2pr
        run: pip install -e ".[dev]"

      - name: Agent works on the pushed code
        id: agent
        continue-on-error: true          # keep going so we still email/PR on a limit
        env:
          GROQ_API_KEY:       ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          python -m app.cli fix . "Review and improve ONLY the code changed in this push. Find bugs, fix them, keep existing behavior." 2>&1 | tee run.log

      - name: Build report
        id: report
        run: |
          echo "changed=$(git diff --name-only | wc -l)" >> "$GITHUB_OUTPUT"
          git diff --stat > diffstat.txt || true

      - name: Email the pusher
        if: always()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          from: Issue2PR Agent <${{ secrets.MAIL_USERNAME }}>
          # Recipient varies per push: the commit author's email from the event.
          to: ${{ github.event.head_commit.author.email }}
          subject: "Agent run on ${{ github.repository }} - ${{ steps.agent.outcome }}"
          body: |
            Repo:    ${{ github.repository }}
            Commit:  ${{ github.sha }}
            Pusher:  ${{ github.event.head_commit.author.name }}
            Outcome: ${{ steps.agent.outcome }}   (success = finished, failure = hit a time/budget limit)
            Files changed by agent: ${{ steps.report.outputs.changed }}

            The agent's full summary of what it did is in the attached run.log.
            Per-file line changes are in diffstat.txt.
            If files were changed, a pull request was opened for review.
          attachments: run.log,diffstat.txt

      - name: Open PR with the agent's changes
        if: steps.report.outputs.changed != '0'
        uses: peter-evans/create-pull-request@v6
        with:
          branch: agent/review-${{ github.sha }}
          title: "Agent review of pushed code (${{ steps.agent.outcome }})"
          commit-message: "agent: review pushed code [skip agent]"
          body: "Automated review/fix of ${{ github.sha }}. Outcome: ${{ steps.agent.outcome }}."
